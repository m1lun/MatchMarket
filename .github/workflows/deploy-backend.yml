name: Deploy backend

# Runs after the "Backend tests" workflow succeeds on a push to main, or
# manually. Never runs for pull requests or other branches automatically.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      ENABLE_E2E_ROUTES: ${{ vars.ENABLE_E2E_ROUTES }}
    steps:
      - name: Skip when deployment is not configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST secret is not set; skipping deployment."

      - name: Configure SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull main and restart the stack on the VM
        if: env.DEPLOY_HOST != ''
        run: |
          case "$ENABLE_E2E_ROUTES" in
            ''|true|false) ;;
            *) echo "The ENABLE_E2E_ROUTES variable must be true or false." >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${DEPLOY_PATH:-/opt/cpen321}' && git fetch origin main && git reset --hard origin/main && E2E='$ENABLE_E2E_ROUTES' ./scripts/set-e2e-routes.sh && ./scripts/run-backend.sh"

      # The certificate the app pins, so this check fails if the VM ever
      # serves a different one than the app trusts.
      - name: Check out the pinned certificate
        if: env.DEPLOY_HOST != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: frontend/app/src/main/res/raw/server_cert.pem
          sparse-checkout-cone-mode: false

      - name: Check the deployed backend
        if: env.DEPLOY_HOST != ''
        run: curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused --cacert frontend/app/src/main/res/raw/server_cert.pem "https://$DEPLOY_HOST:3000/health"
